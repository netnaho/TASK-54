{{$data := .Data}}
{{$target := index $data "TargetUser"}}
<div class="page-header">
  <h1 class="page-title">Reset Password</h1>
  <p class="page-subtitle">Set a new password for <strong>{{$target.DisplayName}}</strong> ({{$target.Email}})</p>
</div>

<div class="form-card">
  <form method="POST" action="/users/{{$target.ID}}/reset-password">
    <input type="hidden" name="row_version" value="{{$target.RowVersion}}">
    {{if index $data "FormError"}}
    <div class="alert alert-error" style="margin-bottom:1rem;">{{index $data "FormError"}}</div>
    {{end}}

    <div class="form-group">
      <label class="form-label" for="password">New password</label>
      <input type="password" id="password" name="password" class="form-input" required
             autocomplete="new-password" minlength="12">
      <p class="form-hint">Minimum 12 characters · uppercase · lowercase · digit · special character</p>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Reset password</button>
      <a href="/users" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
