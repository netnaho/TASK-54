<div class="auth-card">
  <h1 class="auth-title">Sign In</h1>
  <p class="auth-subtitle">Sunridge Rehab &amp; Long-Term Care</p>

  {{if .Error}}
  <div class="alert alert-danger" role="alert">{{.Error}}</div>
  {{end}}

  {{if .Flash}}
  <div class="alert alert-info" role="alert">{{.Flash}}</div>
  {{end}}

  <form action="/login" method="POST" class="auth-form" novalidate>
    <div class="form-group">
      <label for="email" class="form-label">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-input"
        value="{{.Email}}"
        autocomplete="email"
        required
        autofocus
      >
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-input"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
  </form>

  <p class="auth-footer">Local network access only &mdash; no internet connection required.</p>
</div>
