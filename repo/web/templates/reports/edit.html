<div class="page-header">
  <h1 class="page-title">Edit Report Definition</h1>
</div>

{{$data := .Data}}
{{$report := index $data "Report"}}

{{if .Flash}}
<div class="alert alert-error">{{.Flash}}</div>
{{end}}

<section class="section section--narrow">
  <form method="POST" action="/reports/{{$report.ID}}/update">
    <input type="hidden" name="row_version" value="{{$report.RowVersion}}">

    <div class="form-group">
      <label class="form-label" for="name">Report Name <span class="required">*</span></label>
      <input type="text" id="name" name="name" class="form-control" required value="{{$report.Name}}">
    </div>

    <div class="form-group">
      <label class="form-label" for="report_type">Report Type <span class="required">*</span></label>
      <select id="report_type" name="report_type" class="form-control" required>
        {{range (index $data "ValidTypes")}}
        <option value="{{.}}" {{if eq . $report.ReportType}}selected{{end}}>{{.}}</option>
        {{end}}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="output_format">Output Format <span class="required">*</span></label>
      <select id="output_format" name="output_format" class="form-control" required>
        {{range (index $data "ValidFormats")}}
        <option value="{{.}}" {{if eq . $report.OutputFormat}}selected{{end}}>{{.}}</option>
        {{end}}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="schedule_cron">Schedule (cron expression)</label>
      <input type="text" id="schedule_cron" name="schedule_cron" class="form-control"
             value="{{$report.ScheduleCron}}">
    </div>

    <div class="form-group">
      <label class="form-label" for="parameters">Filter Parameters (JSON)</label>
      <textarea id="parameters" name="parameters" class="form-control form-control--mono"
                rows="3">{{$report.Parameters}}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/reports" class="btn">Cancel</a>
    </div>
  </form>
</section>
